<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>08 · Corridor dive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0b0a;--divider:#2c261d;--text:#ece6d9;--n300:#a39a87;--n500:#5f584a;--n700:#342d21;
  --accent:#9c1f22;--accent300:#b8342f;
  --font:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;overflow:hidden;perspective:1400px;perspective-origin:50% 48%;
  background:radial-gradient(ellipse 54% 42% at 50% 48%,#160f0d,#090807 74%)}
#warp{position:absolute;inset:0;z-index:0}
#deck{position:absolute;inset:0;transform-style:preserve-3d;z-index:1}
/* Every panel is a full-screen frame parked at its own depth. The whole set exists at once —
   the ones you have not reached are visible ahead through the one you are reading. */
.pnl{position:absolute;inset:0;border:1px solid rgba(184,52,47,.5);will-change:transform,opacity}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;gap:clamp(20px,5vw,88px);padding:clamp(70px,10vh,120px) clamp(20px,4vw,56px) clamp(60px,9vh,96px)}
.copy{flex:1 1 auto;min-width:0;max-width:760px;display:flex;flex-direction:column;gap:clamp(14px,2vh,26px)}
.k{font:400 11px/1 var(--font);letter-spacing:.22em;text-transform:uppercase;color:var(--accent300)}
h1{margin:0;font:300 clamp(38px,6.8vw,120px)/0.94 var(--font);letter-spacing:-.05em;text-wrap:balance}
.rule{height:1px;width:min(100%,300px);background:linear-gradient(90deg,var(--accent),transparent)}
p{margin:0;max-width:54ch;font:300 clamp(14px,1.2vw,18px)/1.62 var(--font);color:var(--n300);text-wrap:pretty}
.num{flex:none;font:300 clamp(90px,16vw,270px)/0.7 var(--font);letter-spacing:-.07em;color:transparent;-webkit-text-stroke:1px rgba(236,230,217,.13)}
/* Painted above the veil, not under it — the frame of a panel stays legible at any depth
   while its copy is dimmed, so the corridor reads as receding windows rather than mush. */
.rim{position:absolute;inset:-1px;border:1px solid rgba(184,52,47,.75);box-shadow:0 0 70px rgba(156,31,34,.5),inset 0 0 70px rgba(156,31,34,.2);opacity:0;pointer-events:none}
.sh{position:absolute;inset:0;background:#070605;opacity:0;pointer-events:none}
#hud{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;align-items:center;gap:clamp(12px,2vw,24px);padding:16px clamp(16px,3vw,28px);font:400 10px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--n500);background:linear-gradient(#0c0b0a00,#0c0b0aee)}
#hud b{color:var(--text);font-weight:500}
#track{position:relative;flex:1;height:2px;background:var(--n700);cursor:ew-resize;touch-action:none}
#fill{position:absolute;inset:0;background:var(--accent300);transform-origin:0 50%}
#pos{min-width:130px;color:var(--n300)}
#keys{opacity:.66}
a{color:var(--n500);text-decoration:none;position:fixed;top:0;left:0;z-index:50;padding:16px 20px;font:400 10px/1 var(--font);letter-spacing:.16em;text-transform:uppercase}
a:hover{color:var(--accent300)}
@media (max-width:760px){#keys{display:none}#pos{min-width:0}}
</style>
</head>
<body>
<div id="stage"><canvas id="warp"></canvas><div id="deck"></div></div>
<a href="./index.html">← all</a>
<div id="hud">
  <span><b>08</b> Corridor dive</span>
  <div id="track"><span id="fill"></span></div>
  <span id="pos"></span>
  <span id="keys">scroll / drag · ← → step · space play</span>
</div>
<script>
const DATA=[
 {n:'01',k:'Specification',g:'20% 26%',t:'Start at the assumption',d:'Most agent failures are specification failures. I write the assumption down first, then build the smallest thing that can falsify it.'},
 {n:'02',k:'Traceability',g:'78% 24%',t:'Make the work replayable',d:'Every step an agent takes is recorded with the context that produced it, so a reviewer reads intent instead of reconstructing it from a diff.'},
 {n:'03',k:'Isolation',g:'26% 74%',t:'Sandbox before you trust',d:'Execution is isolated by default. Nothing an agent runs can reach production until a human has seen the trace it produced.'},
 {n:'04',k:'Evidence',g:'74% 70%',t:'Ship, then measure',d:'Systems earn their complexity. If a layer cannot show what it caught last week, it comes back out.'}
];
// Translucent walls. Solid ones would turn the corridor back into four separate slides.
const bg=r=>'radial-gradient(ellipse 92% 74% at '+r.g+',rgba(40,17,15,.88),transparent 62%),linear-gradient(168deg,rgba(24,21,15,.89),rgba(11,10,9,.93) 62%)';
const faceHTML=r=>'<div class="face"><div class="copy"><span class="k">'+r.k+'</span><h1>'+r.t+'</h1><span class="rule"></span><p>'+r.d+'</p></div><span class="num">'+r.n+'</span></div><span class="sh"></span><span class="rim"></span>';

const deck=document.getElementById('deck');
const panels=DATA.map(r=>{
  const el=document.createElement('div');el.className='pnl';
  el.style.background=bg(r);el.innerHTML=faceHTML(r);deck.appendChild(el);
  el.rim=el.querySelector('.rim');el.sh=el.querySelector('.sh');el.fc=el.querySelector('.face');return el;
});
const clamp01=x=>Math.max(0,Math.min(1,x));
const D=1000,P=1400;                              // one panel of depth, and the camera's lens

function render(f){
  // The camera moves, not the set. Everything else follows from where each panel is parked.
  deck.style.transform='translateZ('+(f*D).toFixed(1)+'px)';
  for(let i=0;i<panels.length;i++){
    const p=panels[i],k=i-f;                      // 0 = the one filling the frame, >0 = ahead
    if(k>3.5||k<-.6){p.style.visibility='hidden';continue;}
    p.style.visibility='visible';
    p.style.transform='translateZ('+(-i*D)+'px)';
    // Two fades, not one. The copy has to be gone almost immediately — a headline scaling past
    // the camera reads straight through the one arriving and the two collide. The wall it sits
    // on keeps going, so what flies past the lens is a lit pane rather than a word salad.
    const wall=1-clamp01((-k-.06)/.5);
    p.style.opacity=wall.toFixed(3);
    p.fc.style.opacity=(k<0?1-clamp01(-k/.2):1).toFixed(3);
    // The copy on a panel you have not reached is dimmed hard — one readable headline at a
    // time — but its frame keeps a floor so the corridor ahead stays visible all the way back.
    p.sh.style.opacity=Math.min(.86,Math.max(0,k*.52)).toFixed(3);
    p.rim.style.opacity=(k<0?clamp01(-k*6)*wall*.7
                             :clamp01(k*3)*(.34+clamp01(1-Math.abs(k-1))*.56)).toFixed(3);
  }
}

/* Streaks read the scroll's own speed, so the corridor only stretches while you are moving
   through it. Same field the hero's black hole uses. */
const cv=document.getElementById('warp'),cx=cv.getContext('2d');
let stars=[],DW=0,DH=0,dpr=Math.min(2,devicePixelRatio||1);
function seed(){
  DW=innerWidth;DH=innerHeight;cv.width=DW*dpr;cv.height=DH*dpr;
  cv.style.width=DW+'px';cv.style.height=DH+'px';cx.setTransform(dpr,0,0,dpr,0,0);
  stars=[];for(let i=0;i<190;i++)stars.push({a:Math.random()*Math.PI*2,r:20+Math.random()*Math.max(DW,DH)*.75,b:.15+Math.random()*.65});
}
seed();addEventListener('resize',seed);
function warp(speed){
  cx.clearRect(0,0,DW,DH);
  const cxx=DW/2,cyy=DH*.48,len=Math.min(230,speed*2600);
  for(const s of stars){
    s.r+=speed*260;if(s.r>Math.max(DW,DH)*.85)s.r=20+Math.random()*60;
    const ca=Math.cos(s.a),sa=Math.sin(s.a);
    const x=cxx+ca*s.r,y=cyy+sa*s.r;
    if(len<1.2){cx.fillStyle='rgba(236,230,217,'+(s.b*.5).toFixed(3)+')';cx.fillRect(x,y,1.3,1.3);continue;}
    cx.strokeStyle='rgba(236,230,217,'+(s.b*Math.min(1,len/90)).toFixed(3)+')';
    cx.lineWidth=1.1;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x-ca*len,y-sa*len);cx.stroke();
  }
}

/* ---- shared demo harness ---- */
const N=DATA.length;let f=0,tgt=0,auto=false,last=0,prevF=0;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
addEventListener('wheel',e=>{e.preventDefault();auto=false;tgt=clamp(tgt+e.deltaY*.0024,0,N-1);},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){auto=false;tgt=clamp(Math.round(tgt)+1,0,N-1);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){auto=false;tgt=clamp(Math.round(tgt)-1,0,N-1);}
  else if(e.key===' '){e.preventDefault();auto=!auto;}
});
const track=document.getElementById('track'),fill=document.getElementById('fill'),pos=document.getElementById('pos');
let dragging=false;
const scrub=e=>{const r=track.getBoundingClientRect();tgt=clamp((e.clientX-r.left)/r.width*(N-1),0,N-1);};
track.addEventListener('pointerdown',e=>{dragging=true;auto=false;track.setPointerCapture(e.pointerId);scrub(e);});
track.addEventListener('pointermove',e=>{if(dragging)scrub(e);});
addEventListener('pointerup',()=>{dragging=false;});
function loop(now){
  const dt=clamp((now-(last||now))/16.667,0,3);last=now;
  if(auto){tgt+=.0075*dt;if(tgt>N-1)tgt=0;}
  f+=(tgt-f)*(1-Math.pow(1-.11,dt));
  render(f);
  warp(Math.abs(f-prevF)/Math.max(dt,.001));prevF=f;
  fill.style.transform='scaleX('+(f/(N-1)).toFixed(4)+')';
  const b=clamp(Math.floor(f),0,N-2);
  pos.textContent=(b+1)+' → '+(b+2)+' · t '+clamp(f-b,0,1).toFixed(2);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
